<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0F1E"/>
      <stop offset="50%" style="stop-color:#0D1B3E"/>
      <stop offset="100%" style="stop-color:#0A0F1E"/>
    </linearGradient>

    <!-- Glow gradients -->
    <radialGradient id="glowLeft" cx="20%" cy="50%" r="55%">
      <stop offset="0%" style="stop-color:#06B6D4;stop-opacity:0.18"/>
      <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="80%" cy="40%" r="50%">
      <stop offset="0%" style="stop-color:#7C3AED;stop-opacity:0.22"/>
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glowCenter" cx="50%" cy="100%" r="60%">
      <stop offset="0%" style="stop-color:#06B6D4;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:0"/>
    </radialGradient>

    <!-- Title gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#38BDF8"/>
      <stop offset="50%" style="stop-color:#A78BFA"/>
      <stop offset="100%" style="stop-color:#38BDF8"/>
    </linearGradient>

    <!-- Cyan glow filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textGlow" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="nodeGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Clip for dashboard -->
    <clipPath id="dashClip">
      <rect x="720" y="160" width="440" height="340" rx="24"/>
    </clipPath>
  </defs>

  <!-- ── Background ── -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#glowLeft)"/>
  <rect width="1200" height="630" fill="url(#glowRight)"/>
  <rect width="1200" height="630" fill="url(#glowCenter)"/>

  <!-- ── Grid lines (subtle) ── -->
  <g opacity="0.06" stroke="#38BDF8" stroke-width="0.8">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="150" y1="0" x2="150" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="450" y1="0" x2="450" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="750" y1="0" x2="750" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1050" y1="0" x2="1050" y2="630"/>
  </g>

  <!-- ── Neural network (left side) ── -->
  <g opacity="0.35">
    <!-- Connection lines -->
    <line x1="60" y1="120" x2="160" y2="200" stroke="#06B6D4" stroke-width="1"/>
    <line x1="60" y1="120" x2="155" y2="310" stroke="#06B6D4" stroke-width="1"/>
    <line x1="60" y1="310" x2="160" y2="200" stroke="#06B6D4" stroke-width="1"/>
    <line x1="60" y1="310" x2="155" y2="310" stroke="#06B6D4" stroke-width="1"/>
    <line x1="60" y1="500" x2="160" y2="420" stroke="#06B6D4" stroke-width="1"/>
    <line x1="60" y1="500" x2="155" y2="310" stroke="#06B6D4" stroke-width="1"/>
    <line x1="160" y1="200" x2="270" y2="150" stroke="#7C3AED" stroke-width="1"/>
    <line x1="160" y1="200" x2="270" y2="260" stroke="#7C3AED" stroke-width="1"/>
    <line x1="155" y1="310" x2="270" y2="260" stroke="#7C3AED" stroke-width="1"/>
    <line x1="155" y1="310" x2="270" y2="380" stroke="#7C3AED" stroke-width="1"/>
    <line x1="160" y1="420" x2="270" y2="380" stroke="#7C3AED" stroke-width="1"/>
    <line x1="160" y1="420" x2="270" y2="480" stroke="#7C3AED" stroke-width="1"/>
    <line x1="270" y1="150" x2="370" y2="200" stroke="#06B6D4" stroke-width="1"/>
    <line x1="270" y1="260" x2="370" y2="200" stroke="#06B6D4" stroke-width="1"/>
    <line x1="270" y1="260" x2="370" y2="310" stroke="#06B6D4" stroke-width="1"/>
    <line x1="270" y1="380" x2="370" y2="310" stroke="#06B6D4" stroke-width="1"/>
    <line x1="270" y1="380" x2="370" y2="420" stroke="#06B6D4" stroke-width="1"/>
    <line x1="270" y1="480" x2="370" y2="420" stroke="#06B6D4" stroke-width="1"/>
  </g>

  <!-- Neural nodes -->
  <g filter="url(#nodeGlow)">
    <!-- Layer 1 -->
    <circle cx="60" cy="120" r="5" fill="#38BDF8" opacity="0.9"/>
    <circle cx="60" cy="310" r="5" fill="#38BDF8" opacity="0.9"/>
    <circle cx="60" cy="500" r="5" fill="#38BDF8" opacity="0.9"/>
    <!-- Layer 2 -->
    <circle cx="160" cy="200" r="6" fill="#06B6D4" opacity="0.85"/>
    <circle cx="155" cy="310" r="6" fill="#A78BFA" opacity="0.85"/>
    <circle cx="160" cy="420" r="6" fill="#06B6D4" opacity="0.85"/>
    <!-- Layer 3 -->
    <circle cx="270" cy="150" r="5" fill="#38BDF8" opacity="0.8"/>
    <circle cx="270" cy="260" r="5" fill="#A78BFA" opacity="0.8"/>
    <circle cx="270" cy="380" r="5" fill="#38BDF8" opacity="0.8"/>
    <circle cx="270" cy="480" r="5" fill="#A78BFA" opacity="0.8"/>
    <!-- Layer 4 -->
    <circle cx="370" cy="200" r="6" fill="#06B6D4" opacity="0.75"/>
    <circle cx="370" cy="310" r="6" fill="#7C3AED" opacity="0.75"/>
    <circle cx="370" cy="420" r="6" fill="#06B6D4" opacity="0.75"/>
  </g>

  <!-- ── Cockpit Dashboard (right side) ── -->
  <!-- Dashboard frame -->
  <rect x="720" y="160" width="440" height="340" rx="24" fill="#0D1F3C" stroke="#1E3A5F" stroke-width="1.5" opacity="0.95"/>
  <!-- Top bar -->
  <rect x="720" y="160" width="440" height="36" rx="0" fill="#0A1628" opacity="0.8"/>
  <rect x="720" y="160" width="440" height="36" rx="24 24 0 0" fill="#0A1628"/>
  <circle cx="746" cy="178" r="6" fill="#FF5F57"/>
  <circle cx="766" cy="178" r="6" fill="#FFBD2E"/>
  <circle cx="786" cy="178" r="6" fill="#28CA41"/>
  <text x="940" y="183" text-anchor="middle" font-size="11" fill="#38BDF8" font-family="monospace" opacity="0.8">AI DECISION ENGINE v2.4</text>

  <!-- Gauge 1 — Confidence -->
  <g transform="translate(780, 270)">
    <circle cx="0" cy="0" r="52" fill="none" stroke="#1E3A5F" stroke-width="8"/>
    <circle cx="0" cy="0" r="52" fill="none" stroke="#06B6D4" stroke-width="8"
      stroke-dasharray="230 98" stroke-dashoffset="82" stroke-linecap="round" opacity="0.9"/>
    <circle cx="0" cy="0" r="52" fill="none" stroke="#38BDF8" stroke-width="3"
      stroke-dasharray="230 98" stroke-dashoffset="82" opacity="0.4"/>
    <text x="0" y="6" text-anchor="middle" font-size="20" font-weight="bold" fill="#38BDF8" font-family="monospace">94%</text>
    <text x="0" y="22" text-anchor="middle" font-size="9" fill="#94A3B8" font-family="sans-serif">CONFIDENCE</text>
  </g>

  <!-- Gauge 2 — Accuracy -->
  <g transform="translate(940, 270)">
    <circle cx="0" cy="0" r="52" fill="none" stroke="#1E3A5F" stroke-width="8"/>
    <circle cx="0" cy="0" r="52" fill="none" stroke="#7C3AED" stroke-width="8"
      stroke-dasharray="200 128" stroke-dashoffset="82" stroke-linecap="round" opacity="0.9"/>
    <circle cx="0" cy="0" r="52" fill="none" stroke="#A78BFA" stroke-width="3"
      stroke-dasharray="200 128" stroke-dashoffset="82" opacity="0.4"/>
    <text x="0" y="6" text-anchor="middle" font-size="20" font-weight="bold" fill="#A78BFA" font-family="monospace">87%</text>
    <text x="0" y="22" text-anchor="middle" font-size="9" fill="#94A3B8" font-family="sans-serif">ACCURACY</text>
  </g>

  <!-- Gauge 3 — Speed -->
  <g transform="translate(1100, 270)">
    <circle cx="0" cy="0" r="52" fill="none" stroke="#1E3A5F" stroke-width="8"/>
    <circle cx="0" cy="0" r="52" fill="none" stroke="#10B981" stroke-width="8"
      stroke-dasharray="245 83" stroke-dashoffset="82" stroke-linecap="round" opacity="0.9"/>
    <circle cx="0" cy="0" r="52" fill="none" stroke="#34D399" stroke-width="3"
      stroke-dasharray="245 83" stroke-dashoffset="82" opacity="0.4"/>
    <text x="0" y="6" text-anchor="middle" font-size="20" font-weight="bold" fill="#34D399" font-family="monospace">3.2x</text>
    <text x="0" y="22" text-anchor="middle" font-size="9" fill="#94A3B8" font-family="sans-serif">SPEED</text>
  </g>

  <!-- Separator line -->
  <line x1="740" y1="348" x2="1140" y2="348" stroke="#1E3A5F" stroke-width="1"/>

  <!-- Activity bars -->
  <g transform="translate(740, 360)">
    <text x="0" y="12" font-size="9" fill="#64748B" font-family="monospace">SIGNAL STREAM</text>
    <!-- Bars -->
    <rect x="0"   y="20" width="8" height="50" rx="3" fill="#1E3A5F"/>
    <rect x="0"   y="42" width="8" height="28" rx="3" fill="#06B6D4" opacity="0.8"/>
    <rect x="14"  y="20" width="8" height="50" rx="3" fill="#1E3A5F"/>
    <rect x="14"  y="28" width="8" height="42" rx="3" fill="#7C3AED" opacity="0.8"/>
    <rect x="28"  y="20" width="8" height="50" rx="3" fill="#1E3A5F"/>
    <rect x="28"  y="35" width="8" height="35" rx="3" fill="#06B6D4" opacity="0.8"/>
    <rect x="42"  y="20" width="8" height="50" rx="3" fill="#1E3A5F"/>
    <rect x="42"  y="22" width="8" height="48" rx="3" fill="#38BDF8" opacity="0.9"/>
    <rect x="56"  y="20" width="8" height="50" rx="3" fill="#1E3A5F"/>
    <rect x="56"  y="38" width="8" height="32" rx="3" fill="#7C3AED" opacity="0.8"/>
    <rect x="70"  y="20" width="8" height="50" rx="3" fill="#1E3A5F"/>
    <rect x="70"  y="30" width="8" height="40" rx="3" fill="#06B6D4" opacity="0.8"/>
    <rect x="84"  y="20" width="8" height="50" rx="3" fill="#1E3A5F"/>
    <rect x="84"  y="24" width="8" height="46" rx="3" fill="#A78BFA" opacity="0.9"/>
    <rect x="98"  y="20" width="8" height="50" rx="3" fill="#1E3A5F"/>
    <rect x="98"  y="40" width="8" height="30" rx="3" fill="#38BDF8" opacity="0.8"/>
  </g>

  <!-- Status pills -->
  <g transform="translate(920, 366)">
    <rect x="0"   y="0" width="86" height="22" rx="11" fill="#06B6D4" opacity="0.15" stroke="#06B6D4" stroke-width="0.8"/>
    <circle cx="12" cy="11" r="3.5" fill="#06B6D4"/>
    <text x="22" y="15" font-size="9.5" fill="#38BDF8" font-family="monospace">ACTIVE</text>
    <rect x="96"  y="0" width="100" height="22" rx="11" fill="#10B981" opacity="0.12" stroke="#10B981" stroke-width="0.8"/>
    <circle cx="108" cy="11" r="3.5" fill="#10B981"/>
    <text x="118" y="15" font-size="9.5" fill="#34D399" font-family="monospace">LEARNING</text>
  </g>

  <!-- Waveform line -->
  <polyline
    points="740,450 760,440 775,455 790,432 808,460 825,438 840,452 858,430 875,458 890,436 908,448 925,428 942,456 958,435 975,450 990,430 1005,454 1022,436 1038,448 1055,426 1072,452 1090,438 1108,446 1125,430 1142,448"
    fill="none" stroke="#06B6D4" stroke-width="1.5" opacity="0.6"/>
  <polyline
    points="740,450 760,440 775,455 790,432 808,460 825,438 840,452 858,430 875,458 890,436 908,448 925,428 942,456 958,435 975,450 990,430 1005,454 1022,436 1038,448 1055,426 1072,452 1090,438 1108,446 1125,430 1142,448"
    fill="none" stroke="#38BDF8" stroke-width="0.5" opacity="0.3"/>

  <!-- ── Left content block ── -->

  <!-- Eyebrow label -->
  <rect x="48" y="80" width="130" height="24" rx="12" fill="#06B6D4" opacity="0.12" stroke="#06B6D4" stroke-width="0.8"/>
  <circle cx="64" cy="92" r="3.5" fill="#06B6D4"/>
  <text x="75" y="97" font-size="10" fill="#38BDF8" font-family="'Arial', sans-serif" font-weight="600" letter-spacing="1">FOR PRODUCT MGR</text>

  <!-- Main title line 1 -->
  <text x="48" y="170" font-size="62" font-weight="900" fill="url(#titleGrad)" font-family="'Arial Black', sans-serif" filter="url(#textGlow)">AI as Your</text>

  <!-- Main title line 2 -->
  <text x="48" y="240" font-size="62" font-weight="900" fill="white" font-family="'Arial Black', sans-serif">Co-Pilot</text>

  <!-- Subtitle -->
  <text x="48" y="286" font-size="18" fill="#94A3B8" font-family="'Arial', sans-serif" font-weight="400">How Product Managers Can</text>
  <text x="48" y="310" font-size="18" fill="#94A3B8" font-family="'Arial', sans-serif" font-weight="400">Supercharge Decision-Making</text>

  <!-- Divider -->
  <line x1="48" y1="334" x2="320" y2="334" stroke="#1E3A5F" stroke-width="1.5"/>

  <!-- Feature pills -->
  <g transform="translate(48, 350)">
    <rect x="0" y="0" width="90" height="28" rx="14" fill="#06B6D4" opacity="0.12" stroke="#06B6D4" stroke-width="0.8"/>
    <text x="45" y="18" text-anchor="middle" font-size="11" fill="#38BDF8" font-family="'Arial', sans-serif" font-weight="600">⚡ Insights</text>

    <rect x="100" y="0" width="100" height="28" rx="14" fill="#7C3AED" opacity="0.15" stroke="#7C3AED" stroke-width="0.8"/>
    <text x="150" y="18" text-anchor="middle" font-size="11" fill="#A78BFA" font-family="'Arial', sans-serif" font-weight="600">🤖 Automation</text>

    <rect x="210" y="0" width="100" height="28" rx="14" fill="#10B981" opacity="0.12" stroke="#10B981" stroke-width="0.8"/>
    <text x="260" y="18" text-anchor="middle" font-size="11" fill="#34D399" font-family="'Arial', sans-serif" font-weight="600">📈 Forecasting</text>
  </g>

  <!-- Stat cards -->
  <g transform="translate(48, 406)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="120" height="72" rx="12" fill="#0D1F3C" stroke="#1E3A5F" stroke-width="1"/>
    <text x="14" y="24" font-size="28" font-weight="900" fill="#38BDF8" font-family="'Arial Black', sans-serif">3x</text>
    <text x="14" y="42" font-size="10" fill="#64748B" font-family="'Arial', sans-serif">Faster decisions</text>
    <text x="14" y="56" font-size="10" fill="#64748B" font-family="'Arial', sans-serif">with AI assist</text>

    <!-- Card 2 -->
    <rect x="132" y="0" width="120" height="72" rx="12" fill="#0D1F3C" stroke="#1E3A5F" stroke-width="1"/>
    <text x="146" y="24" font-size="28" font-weight="900" fill="#A78BFA" font-family="'Arial Black', sans-serif">40%</text>
    <text x="146" y="42" font-size="10" fill="#64748B" font-family="'Arial', sans-serif">Less manual</text>
    <text x="146" y="56" font-size="10" fill="#64748B" font-family="'Arial', sans-serif">research time</text>

    <!-- Card 3 -->
    <rect x="264" y="0" width="120" height="72" rx="12" fill="#0D1F3C" stroke="#1E3A5F" stroke-width="1"/>
    <text x="278" y="24" font-size="28" font-weight="900" fill="#34D399" font-family="'Arial Black', sans-serif">10x</text>
    <text x="278" y="42" font-size="10" fill="#64748B" font-family="'Arial', sans-serif">More data</text>
    <text x="278" y="56" font-size="10" fill="#64748B" font-family="'Arial', sans-serif">processed/day</text>
  </g>

  <!-- ── Floating accent dots ── -->
  <circle cx="490" cy="50"  r="3" fill="#38BDF8" opacity="0.5"/>
  <circle cx="510" cy="80"  r="2" fill="#A78BFA" opacity="0.4"/>
  <circle cx="530" cy="40"  r="1.5" fill="#38BDF8" opacity="0.4"/>
  <circle cx="550" cy="70"  r="2.5" fill="#06B6D4" opacity="0.35"/>
  <circle cx="480" cy="580" r="2" fill="#7C3AED" opacity="0.5"/>
  <circle cx="500" cy="600" r="3" fill="#38BDF8" opacity="0.35"/>
  <circle cx="520" cy="570" r="1.5" fill="#A78BFA" opacity="0.45"/>

  <!-- Connector line from neural net to content -->
  <line x1="380" y1="310" x2="440" y2="310" stroke="#06B6D4" stroke-width="1" opacity="0.3" stroke-dasharray="4 3"/>

  <!-- ── Byline ── -->
  <text x="1152" y="614" text-anchor="end" font-size="13" font-weight="700" fill="#38BDF8" font-family="'Arial', sans-serif" opacity="0.7" letter-spacing="0.5">By Kartik Bhalerao</text>

  <!-- Bottom glow strip -->
  <rect x="0" y="610" width="1200" height="20" fill="url(#glowCenter)" opacity="0.5"/>
</svg>
