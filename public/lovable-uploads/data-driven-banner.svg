  <text x="122" y="86" text-anchor="middle" font-size="10" fill="#38BDF8" font-family="'Arial',sans-serif" font-weight="700" letter-spacing="1.5">ANALYTICS · STRATEGY</text>

  <!-- Title -->
  <text x="48" y="158" font-size="58" font-weight="900" fill="url(#titleGrad)" font-family="'Arial Black',sans-serif" filter="url(#softGlow)">Data-Driven</text>
  <text x="48" y="224" font-size="58" font-weight="900" fill="white" font-family="'Arial Black',sans-serif">Decision Making</text>

  <!-- Subtitle -->
  <text x="48" y="268" font-size="17" fill="#64748B" font-family="'Arial',sans-serif">Balancing quantitative insights with</text>
  <text x="48" y="290" font-size="17" fill="#64748B" font-family="'Arial',sans-serif">qualitative user feedback</text>

  <!-- Divider -->
  <rect x="48" y="312" width="280" height="2" rx="1" fill="url(#lineGrad)" opacity="0.6"/>

  <!-- Key metrics row -->
  <g transform="translate(48,330)">
    <rect x="0" y="0" width="100" height="64" rx="10" fill="#0D1F3C" stroke="#1E3A5F" stroke-width="1"/>
    <text x="50" y="28" text-anchor="middle" font-size="26" font-weight="900" fill="#38BDF8" font-family="'Arial Black',sans-serif">2.4x</text>
    <text x="50" y="46" text-anchor="middle" font-size="9" fill="#475569" font-family="'Arial',sans-serif">ROI Increase</text>
    <text x="50" y="58" text-anchor="middle" font-size="9" fill="#475569" font-family="'Arial',sans-serif">with data</text>

    <rect x="112" y="0" width="100" height="64" rx="10" fill="#0D1F3C" stroke="#1E3A5F" stroke-width="1"/>
    <text x="162" y="28" text-anchor="middle" font-size="26" font-weight="900" fill="#06B6D4" font-family="'Arial Black',sans-serif">78%</text>
    <text x="162" y="46" text-anchor="middle" font-size="9" fill="#475569" font-family="'Arial',sans-serif">Better product</text>
    <text x="162" y="58" text-anchor="middle" font-size="9" fill="#475569" font-family="'Arial',sans-serif">decisions</text>

    <rect x="224" y="0" width="100" height="64" rx="10" fill="#0D1F3C" stroke="#1E3A5F" stroke-width="1"/>
    <text x="274" y="28" text-anchor="middle" font-size="26" font-weight="900" fill="#14B8A6" font-family="'Arial Black',sans-serif">5x</text>
    <text x="274" y="46" text-anchor="middle" font-size="9" fill="#475569" font-family="'Arial',sans-serif">Faster insight</text>
    <text x="274" y="58" text-anchor="middle" font-size="9" fill="#475569" font-family="'Arial',sans-serif">discovery</text>
