    <rect x="0"   y="44"  width="38" height="70"  rx="4" fill="url(#barBlue)" opacity="0.85"/>
    <rect x="48"  y="54"  width="38" height="60"  rx="4" fill="url(#barCyan)" opacity="0.8"/>
    <rect x="96"  y="34"  width="38" height="80"  rx="4" fill="url(#barBlue)" opacity="0.9"/>
