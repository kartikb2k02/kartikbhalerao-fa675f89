  <rect x="580" y="50" width="570" height="44" rx="0" fill="#0A1628"/>
  <rect x="580" y="50" width="570" height="44" rx="24 24 0 0" fill="#0A1628"/>
  <circle cx="606" cy="72" r="5" fill="#FF5F57" opacity="0.8"/>
  <circle cx="622" cy="72" r="5" fill="#FFBD2E" opacity="0.8"/>
