    <!-- Donut mini 1 -->
    <circle cx="30" cy="30" r="26" fill="none" stroke="#0F2D4A" stroke-width="7"/>
    <circle cx="30" cy="30" r="26" fill="none" stroke="#38BDF8" stroke-width="7" stroke-dasharray="110 54" stroke-dashoffset="20" stroke-linecap="round"/>
    <text x="30" y="35" text-anchor="middle" font-size="10" font-weight="bold" fill="#38BDF8" font-family="monospace">67%</text>

    <text x="68" y="22" font-size="11" font-weight="700" fill="#CBD5E1" font-family="'Arial',sans-serif">Qual Insights</text>
    <text x="68" y="38" font-size="9" fill="#475569" font-family="'Arial',sans-serif">Integrated in decisions</text>

    <!-- Donut mini 2 -->
    <circle cx="230" cy="30" r="26" fill="none" stroke="#0F2D4A" stroke-width="7"/>
    <circle cx="230" cy="30" r="26" fill="none" stroke="#06B6D4" stroke-width="7" stroke-dasharray="131 33" stroke-dashoffset="20" stroke-linecap="round"/>
    <text x="230" y="35" text-anchor="middle" font-size="10" font-weight="bold" fill="#06B6D4" font-family="monospace">80%</text>

    <text x="268" y="22" font-size="11" font-weight="700" fill="#CBD5E1" font-family="'Arial',sans-serif">Quant Data</text>
    <text x="268" y="38" font-size="9" fill="#475569" font-family="'Arial',sans-serif">Backed by metrics</text>

    <!-- Donut mini 3 -->
    <circle cx="450" cy="30" r="26" fill="none" stroke="#0F2D4A" stroke-width="7"/>
    <circle cx="450" cy="30" r="26" fill="none" stroke="#14B8A6" stroke-width="7" stroke-dasharray="147 17" stroke-dashoffset="20" stroke-linecap="round"/>
    <text x="450" y="35" text-anchor="middle" font-size="10" font-weight="bold" fill="#14B8A6" font-family="monospace">90%</text>

    <text x="488" y="22" font-size="11" font-weight="700" fill="#CBD5E1" font-family="'Arial',sans-serif">Accuracy</text>
    <text x="488" y="38" font-size="9" fill="#475569" font-family="'Arial',sans-serif">Decision confidence</text>
