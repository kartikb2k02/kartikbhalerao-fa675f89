    <rect x="126" y="0" width="134" height="26" rx="13" fill="#06B6D4" opacity="0.1" stroke="#06B6D4" stroke-width="0.7" stroke-opacity="0.5"/>
    <text x="193" y="17" text-anchor="middle" font-size="11" fill="#06B6D4" font-family="'Arial',sans-serif" font-weight="600">🎯 Product Strategy</text>
