  <!-- Byline -->
  <text x="1152" y="614" text-anchor="end" font-size="13" font-weight="700" fill="#38BDF8" font-family="'Arial',sans-serif" opacity="0.6" letter-spacing="0.5">By Kartik Bhalerao</text>
