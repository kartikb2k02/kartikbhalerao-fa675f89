    <rect x="336" y="4"   width="38" height="110" rx="4" fill="url(#barBlue)" opacity="0.9" filter="url(#glow)"/>
    <rect x="384" y="24"  width="38" height="90"  rx="4" fill="url(#barCyan)" opacity="0.85"/>
    <rect x="432" y="14"  width="38" height="100" rx="4" fill="url(#barTeal)" opacity="0.8" filter="url(#glow)"/>
    <rect x="480" y="34"  width="38" height="80"  rx="4" fill="url(#barBlue)" opacity="0.9"/>
    <!-- baseline -->
    <line x1="0" y1="114" x2="520" y2="114" stroke="#0F2D4A" stroke-width="1"/>
    <!-- labels -->
    <text x="14"  y="128" text-anchor="middle" font-size="8" fill="#334155" font-family="monospace">J</text>
    <text x="62"  y="128" text-anchor="middle" font-size="8" fill="#334155" font-family="monospace">F</text>
    <text x="110" y="128" text-anchor="middle" font-size="8" fill="#334155" font-family="monospace">M</text>
    <text x="158" y="128" text-anchor="middle" font-size="8" fill="#38BDF8"  font-family="monospace" font-weight="bold">A</text>
    <text x="206" y="128" text-anchor="middle" font-size="8" fill="#334155" font-family="monospace">M</text>
    <text x="254" y="128" text-anchor="middle" font-size="8" fill="#334155" font-family="monospace">J</text>
    <text x="302" y="128" text-anchor="middle" font-size="8" fill="#334155" font-family="monospace">J</text>
    <text x="350" y="128" text-anchor="middle" font-size="8" fill="#38BDF8"  font-family="monospace" font-weight="bold">A</text>
    <text x="398" y="128" text-anchor="middle" font-size="8" fill="#334155" font-family="monospace">S</text>
    <text x="446" y="128" text-anchor="middle" font-size="8" fill="#334155" font-family="monospace">O</text>
    <text x="494" y="128" text-anchor="middle" font-size="8" fill="#38BDF8"  font-family="monospace" font-weight="bold">N</text>
  </g>

  <!-- Divider -->
  <line x1="600" y1="448" x2="1130" y2="448" stroke="#0F2D4A" stroke-width="1"/>

  <!-- Bottom stat row -->
