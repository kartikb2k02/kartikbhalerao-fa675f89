  <line x1="700"  y1="248" x2="700"  y2="278" stroke="#2D1B4E" stroke-width="1.2"/>
  <line x1="760"  y1="248" x2="760"  y2="278" stroke="#2D1B4E" stroke-width="1.2"/>

