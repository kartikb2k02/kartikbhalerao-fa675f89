<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F0A1E"/>
      <stop offset="40%" style="stop-color:#1A0A2E"/>
      <stop offset="100%" style="stop-color:#0C0A18"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F472B6"/>
      <stop offset="50%" style="stop-color:#C084FC"/>
      <stop offset="100%" style="stop-color:#F472B6"/>
    </linearGradient>
    <linearGradient id="nodeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EC4899"/>
      <stop offset="100%" style="stop-color:#BE185D"/>
    </linearGradient>
    <linearGradient id="nodeGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A855F7"/>
      <stop offset="100%" style="stop-color:#7E22CE"/>
    </linearGradient>
    <linearGradient id="nodeGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6"/>
      <stop offset="100%" style="stop-color:#6D28D9"/>
    </linearGradient>
    <radialGradient id="glowPink" cx="75%" cy="40%" r="60%">
      <stop offset="0%" style="stop-color:#EC4899;stop-opacity:0.18"/>
      <stop offset="100%" style="stop-color:#EC4899;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="20%" cy="70%" r="50%">
      <stop offset="0%" style="stop-color:#7C3AED;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="nodeGlow">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textGlow">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glowPink)"/>
  <rect width="1200" height="630" fill="url(#glowPurple)"/>

  <!-- Grid -->
  <g opacity="0.04" stroke="#A855F7" stroke-width="1">
    <line x1="0" y1="90"  x2="1200" y2="90"/> <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="270" x2="1200" y2="270"/> <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="450" x2="1200" y2="450"/> <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="120" y1="0" x2="120" y2="630"/>  <line x1="240" y1="0" x2="240" y2="630"/>
    <line x1="360" y1="0" x2="360" y2="630"/>  <line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>  <line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="840" y1="0" x2="840" y2="630"/>  <line x1="960" y1="0" x2="960" y2="630"/>
    <line x1="1080" y1="0" x2="1080" y2="630"/>
  </g>

  <!-- ── LEFT CONTENT ── -->
  <!-- Eyebrow -->
  <rect x="48" y="68" width="140" height="26" rx="13" fill="#EC4899" opacity="0.12" stroke="#EC4899" stroke-width="0.8" stroke-opacity="0.6"/>
  <text x="118" y="85" text-anchor="middle" font-size="10" fill="#F472B6" font-family="'Arial',sans-serif" font-weight="700" letter-spacing="1.5">LEADERSHIP</text>

  <!-- Title -->
  <text x="48" y="164" font-size="60" font-weight="900" fill="url(#titleGrad)" font-family="'Arial Black',sans-serif" filter="url(#textGlow)">Scaling Product</text>
  <text x="48" y="232" font-size="60" font-weight="900" fill="white" font-family="'Arial Black',sans-serif">Teams</text>

  <!-- Subtitle -->
  <text x="48" y="276" font-size="17" fill="#6B7280" font-family="'Arial',sans-serif">Lessons Learned the Hard Way</text>
  <text x="48" y="298" font-size="17" fill="#6B7280" font-family="'Arial',sans-serif">While Keeping Quality Intact</text>

  <!-- Divider -->
  <rect x="48" y="318" width="240" height="2" rx="1" fill="#EC4899" opacity="0.4"/>

  <!-- Lesson cards -->
  <g transform="translate(48,334)">
    <rect x="0" y="0" width="430" height="52" rx="10" fill="#1A0A2E" stroke="#2D1B4E" stroke-width="1"/>
    <rect x="0" y="0" width="4" height="52" rx="2 0 0 2" fill="#EC4899"/>
    <text x="22" y="20" font-size="11" font-weight="700" fill="#F472B6" font-family="'Arial',sans-serif">01  Hire for culture, then skills</text>
    <text x="22" y="38" font-size="10.5" fill="#64748B" font-family="'Arial',sans-serif">Skills can be taught. Alignment can't be forced.</text>

    <rect x="0" y="62" width="430" height="52" rx="10" fill="#1A0A2E" stroke="#2D1B4E" stroke-width="1"/>
    <rect x="0" y="62" width="4" height="52" rx="2 0 0 2" fill="#A855F7"/>
    <text x="22" y="82" font-size="11" font-weight="700" fill="#C084FC" font-family="'Arial',sans-serif">02  Document everything obsessively</text>
    <text x="22" y="100" font-size="10.5" fill="#64748B" font-family="'Arial',sans-serif">What lives in heads dies when people leave.</text>

    <rect x="0" y="124" width="430" height="52" rx="10" fill="#1A0A2E" stroke="#2D1B4E" stroke-width="1"/>
    <rect x="0" y="124" width="4" height="52" rx="2 0 0 2" fill="#8B5CF6"/>
    <text x="22" y="144" font-size="11" font-weight="700" fill="#A78BFA" font-family="'Arial',sans-serif">03  Processes serve people, not vice versa</text>
    <text x="22" y="162" font-size="10.5" fill="#64748B" font-family="'Arial',sans-serif">Rigid processes kill creativity at scale.</text>
  </g>

  <!-- Stat row -->
  <g transform="translate(48,540)">
    <rect x="0"   y="0" width="96" height="56" rx="10" fill="#1A0A2E" stroke="#2D1B4E" stroke-width="1"/>
    <text x="48"  y="26" text-anchor="middle" font-size="24" font-weight="900" fill="#F472B6" font-family="'Arial Black',sans-serif">4x</text>
    <text x="48"  y="44" text-anchor="middle" font-size="9"  fill="#475569" font-family="'Arial',sans-serif">Team growth</text>

    <rect x="108" y="0" width="96" height="56" rx="10" fill="#1A0A2E" stroke="#2D1B4E" stroke-width="1"/>
    <text x="156" y="26" text-anchor="middle" font-size="24" font-weight="900" fill="#C084FC" font-family="'Arial Black',sans-serif">92%</text>
    <text x="156" y="44" text-anchor="middle" font-size="9"  fill="#475569" font-family="'Arial',sans-serif">Retention rate</text>

    <rect x="216" y="0" width="96" height="56" rx="10" fill="#1A0A2E" stroke="#2D1B4E" stroke-width="1"/>
    <text x="264" y="26" text-anchor="middle" font-size="24" font-weight="900" fill="#A78BFA" font-family="'Arial Black',sans-serif">↑60%</text>
    <text x="264" y="44" text-anchor="middle" font-size="9"  fill="#475569" font-family="'Arial',sans-serif">Velocity boost</text>
  </g>

