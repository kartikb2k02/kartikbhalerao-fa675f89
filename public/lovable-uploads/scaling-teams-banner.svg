    <circle cx="700"  cy="290" r="16" fill="#9D174D" opacity="0.9"/>
    <circle cx="760"  cy="290" r="16" fill="#9D174D" opacity="0.9"/>
    <circle cx="820"  cy="290" r="16" fill="#7E22CE" opacity="0.9"/>
    <circle cx="865"  cy="290" r="16" fill="#7E22CE" opacity="0.9"/>
    <circle cx="910"  cy="290" r="16" fill="#7E22CE" opacity="0.9"/>
    <circle cx="990"  cy="290" r="16" fill="#5B21B6" opacity="0.9"/>
    <circle cx="1030" cy="290" r="16" fill="#5B21B6" opacity="0.9"/>
    <circle cx="1070" cy="290" r="16" fill="#5B21B6" opacity="0.9"/>
