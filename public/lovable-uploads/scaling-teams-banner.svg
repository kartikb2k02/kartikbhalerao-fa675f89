  <g>
    <text x="640"  y="294" text-anchor="middle" font-size="12" fill="white">👤</text>
    <text x="700"  y="294" text-anchor="middle" font-size="12" fill="white">👤</text>
    <text x="760"  y="294" text-anchor="middle" font-size="12" fill="white">👤</text>
    <text x="820"  y="294" text-anchor="middle" font-size="12" fill="white">👤</text>
    <text x="865"  y="294" text-anchor="middle" font-size="12" fill="white">👤</text>
    <text x="910"  y="294" text-anchor="middle" font-size="12" fill="white">👤</text>
    <text x="990"  y="294" text-anchor="middle" font-size="12" fill="white">👤</text>
    <text x="1030" y="294" text-anchor="middle" font-size="12" fill="white">👤</text>
    <text x="1070" y="294" text-anchor="middle" font-size="12" fill="white">👤</text>
  </g>

  <!-- Divider -->
  <line x1="600" y1="332" x2="1130" y2="332" stroke="#1E0D38" stroke-width="1"/>

  <!-- Growth chart -->
  <text x="865" y="358" text-anchor="middle" font-size="10" fill="#6B21A8" font-family="'Arial',sans-serif" font-weight="600" letter-spacing="0.8">TEAM GROWTH OVER TIME</text>

  <!-- Growth area chart -->
  <polygon points="620,500 680,480 740,460 800,430 860,395 920,355 980,320 1040,285 1100,252 1130,238 1130,500"
