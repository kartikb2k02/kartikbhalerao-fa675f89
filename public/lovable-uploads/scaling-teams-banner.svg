  <line x1="865"  y1="248" x2="865"  y2="278" stroke="#2D1B4E" stroke-width="1.2"/>
  <line x1="910"  y1="248" x2="910"  y2="278" stroke="#2D1B4E" stroke-width="1.2"/>

  <!-- Level 3 connectors (right branch) -->
  <line x1="990"  y1="248" x2="1070" y2="248" stroke="#2D1B4E" stroke-width="1.2"/>
  <line x1="990"  y1="248" x2="990"  y2="278" stroke="#2D1B4E" stroke-width="1.2"/>
  <line x1="1030" y1="248" x2="1030" y2="278" stroke="#2D1B4E" stroke-width="1.2"/>
  <line x1="1070" y1="248" x2="1070" y2="278" stroke="#2D1B4E" stroke-width="1.2"/>

