  <text x="736"  y="516" font-size="8" fill="#4B2167" font-family="monospace">2021</text>
  <text x="856"  y="516" font-size="8" fill="#4B2167" font-family="monospace">2022</text>
  <text x="976"  y="516" font-size="8" fill="#4B2167" font-family="monospace">2023</text>
  <text x="1096" y="516" font-size="8" fill="#F472B6" font-family="monospace" font-weight="bold">2024</text>
