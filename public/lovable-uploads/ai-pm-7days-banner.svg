  <text x="700" y="331" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#ffffff" opacity="0.35" letter-spacing="2">DAY 4</text>
  <text x="700" y="347" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" opacity="0.6">User Stories</text>

  <!-- DAY 5 -->
  <circle cx="680" cy="395" r="5" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.4"/>
  <text x="700" y="391" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#ffffff" opacity="0.35" letter-spacing="2">DAY 5</text>
  <text x="700" y="407" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" opacity="0.6">Rapid Prototyping</text>

  <!-- DAY 6 -->
  <circle cx="680" cy="455" r="5" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.4"/>
  <text x="700" y="451" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#ffffff" opacity="0.35" letter-spacing="2">DAY 6</text>
  <text x="700" y="467" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" opacity="0.6">Feedback Analysis</text>

