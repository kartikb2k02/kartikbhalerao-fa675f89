  <!-- Main title -->
  <text x="60" y="185" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="-1">I Replaced My</text>
  <text x="60" y="265" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="-1">PM Workflow</text>

  <!-- "with AI" line with accent box around "AI" -->
  <text x="60" y="345" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="-1">with </text>
  <rect x="242" y="290" width="118" height="72" rx="10" fill="#ffffff"/>
  <text x="301" y="345" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="64" font-weight="900" fill="#0a0a0a" text-anchor="middle" letter-spacing="-1">AI</text>

  <!-- Divider line -->
  <rect x="60" y="380" width="200" height="2" rx="1" fill="#ffffff" opacity="0.2"/>

  <!-- Stats row -->
  <text x="60" y="420" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#666666" letter-spacing="1">7 DAYS &#160;·&#160; 5 TOOLS &#160;·&#160; 7 PM TASKS</text>

  <!-- Tagline -->
  <text x="60" y="465" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" fill="#aaaaaa">Here's what actually happened.</text>

