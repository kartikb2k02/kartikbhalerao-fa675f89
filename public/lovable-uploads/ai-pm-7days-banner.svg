  <circle cx="680" cy="515" r="7" fill="#ffffff"/>
  <text x="700" y="511" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#ffffff" opacity="0.5" letter-spacing="2">DAY 7</text>
  <text x="700" y="527" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#ffffff">Roadmap Planning</text>

