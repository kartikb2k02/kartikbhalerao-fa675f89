  <circle cx="680" cy="115" r="5" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.4"/>
  <text x="700" y="111" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#ffffff" opacity="0.35" letter-spacing="2">DAY 1</text>
  <text x="700" y="127" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" opacity="0.6">Product Discovery</text>

