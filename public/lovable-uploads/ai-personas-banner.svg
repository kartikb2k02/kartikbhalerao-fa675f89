<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F6F5FF"/>
      <stop offset="50%" style="stop-color:#FAFAFE"/>
      <stop offset="100%" style="stop-color:#F2F1FB"/>
    </linearGradient>
    <linearGradient id="titleAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366F1"/>
      <stop offset="100%" style="stop-color:#7C3AED"/>
    </linearGradient>
    <linearGradient id="cardA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EEF2FF"/>
      <stop offset="100%" style="stop-color:#E0E7FF"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="rgba(79,70,229,0.10)"/>
    </filter>
    <filter id="smallShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="rgba(15,23,42,0.06)"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <circle cx="1140" cy="60" r="180" fill="#7C3AED" opacity="0.05"/>
  <circle cx="40" cy="600" r="170" fill="#6366F1" opacity="0.05"/>

  <!-- Dot grid top-right -->
  <g opacity="0.35">
    <circle cx="1030" cy="36" r="2.6" fill="#A5B4FC"/>
    <circle cx="1058" cy="36" r="2.6" fill="#A5B4FC"/>
    <circle cx="1086" cy="36" r="2.6" fill="#A5B4FC"/>
    <circle cx="1114" cy="36" r="2.6" fill="#A5B4FC"/>
    <circle cx="1142" cy="36" r="2.6" fill="#A5B4FC"/>
    <circle cx="1030" cy="62" r="2.6" fill="#C4B5FD"/>
    <circle cx="1058" cy="62" r="2.6" fill="#C4B5FD"/>
    <circle cx="1086" cy="62" r="2.6" fill="#C4B5FD"/>
    <circle cx="1114" cy="62" r="2.6" fill="#C4B5FD"/>
    <circle cx="1030" cy="88" r="2.6" fill="#A5B4FC"/>
    <circle cx="1058" cy="88" r="2.6" fill="#A5B4FC"/>
    <circle cx="1086" cy="88" r="2.6" fill="#A5B4FC"/>
  </g>

  <!-- ───────────────── LEFT CONTENT ───────────────── -->

  <!-- Eyebrow badge -->
  <rect x="48" y="58" width="216" height="30" rx="15" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1"/>
  <circle cx="68" cy="73" r="3.5" fill="#6366F1"/>
  <text x="80" y="78" font-size="11" fill="#4F46E5" font-family="'Arial',sans-serif" font-weight="700" letter-spacing="1.3">PRODUCT EXPERIMENT</text>

  <!-- Title -->
  <text x="48" y="178" font-size="54" font-weight="900" fill="#1E1B4B" font-family="'Arial Black',sans-serif">Replacing User</text>
  <text x="48" y="246" font-size="54" font-weight="900" fill="#1E1B4B" font-family="'Arial Black',sans-serif">Personas with <tspan fill="url(#titleAccent)">AI</tspan></text>

  <!-- Underline accent -->
  <rect x="48" y="266" width="150" height="5" rx="2.5" fill="url(#titleAccent)" opacity="0.55"/>

  <!-- Subtitle -->
  <text x="48" y="304" font-size="20" font-weight="700" fill="#4F46E5" font-family="'Arial',sans-serif">Here's What I Learned</text>

  <!-- Description -->
  <text x="48" y="336" font-size="14" fill="#52525B" font-family="'Arial',sans-serif">A hands-on experiment comparing static persona slide decks against</text>
  <text x="48" y="356" font-size="14" fill="#52525B" font-family="'Arial',sans-serif">living, AI-generated behavioral archetypes — and what changed</text>
  <text x="48" y="376" font-size="14" fill="#52525B" font-family="'Arial',sans-serif">once the data started <tspan font-weight="700" fill="#1E1B4B">talking back.</tspan></text>

  <!-- Feature icon row -->
  <g font-family="'Arial',sans-serif">
    <g transform="translate(48,412)">
      <circle cx="20" cy="20" r="20" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1"/>
      <text x="20" y="27" text-anchor="middle" font-size="17">🧬</text>
      <text x="0" y="58" font-size="12" fill="#3F3F46" font-weight="600">Built from real</text>
      <text x="0" y="74" font-size="12" fill="#3F3F46" font-weight="600">behavior</text>
    </g>
    <g transform="translate(168,412)">
      <circle cx="20" cy="20" r="20" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1"/>
      <text x="20" y="27" text-anchor="middle" font-size="17">🔄</text>
      <text x="0" y="58" font-size="12" fill="#3F3F46" font-weight="600">Continuously</text>
      <text x="0" y="74" font-size="12" fill="#3F3F46" font-weight="600">self-updating</text>
    </g>
    <g transform="translate(288,412)">
      <circle cx="20" cy="20" r="20" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1"/>
      <text x="20" y="27" text-anchor="middle" font-size="17">🎯</text>
      <text x="0" y="58" font-size="12" fill="#3F3F46" font-weight="600">Evidence over</text>
      <text x="0" y="74" font-size="12" fill="#3F3F46" font-weight="600">guesswork</text>
    </g>
    <g transform="translate(408,412)">
      <circle cx="20" cy="20" r="20" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1"/>
      <text x="20" y="27" text-anchor="middle" font-size="17">⚡</text>
      <text x="0" y="58" font-size="12" fill="#3F3F46" font-weight="600">Faster team</text>
      <text x="0" y="74" font-size="12" fill="#3F3F46" font-weight="600">alignment</text>
    </g>
  </g>

  <!-- Mini comparison table mockup -->
  <g font-family="'Arial',sans-serif">
    <rect x="48" y="500" width="280" height="76" rx="12" fill="white" stroke="#E0E7FF" stroke-width="1.5" filter="url(#smallShadow)"/>
    <!-- header row -->
    <rect x="48" y="500" width="280" height="26" rx="12" fill="#EEF2FF"/>
    <rect x="48" y="514" width="280" height="12" fill="#EEF2FF"/>
    <text x="64" y="517" font-size="10" font-weight="800" fill="#4338CA" letter-spacing="0.6">PERSONA</text>
    <text x="190" y="517" font-size="10" font-weight="800" fill="#4338CA" letter-spacing="0.6">SOURCE</text>
    <text x="262" y="517" font-size="10" font-weight="800" fill="#4338CA" letter-spacing="0.6">CONF.</text>
    <line x1="48" y1="526" x2="328" y2="526" stroke="#E0E7FF" stroke-width="1"/>
    <!-- row 1 -->
    <text x="64" y="544" font-size="10.5" font-weight="700" fill="#1E1B4B">Power User</text>
    <text x="190" y="544" font-size="10.5" fill="#6B7280">Behavior data</text>
    <rect x="262" y="536" width="44" height="13" rx="6.5" fill="#ECFDF5"/>
    <text x="284" y="545" text-anchor="middle" font-size="9" font-weight="800" fill="#059669">94%</text>
    <line x1="48" y1="552" x2="328" y2="552" stroke="#F1F5F9" stroke-width="1"/>
    <!-- row 2 -->
    <text x="64" y="570" font-size="10.5" font-weight="700" fill="#1E1B4B">Skeptical Eval.</text>
    <text x="190" y="570" font-size="10.5" fill="#6B7280">Support tickets</text>
    <rect x="262" y="562" width="44" height="13" rx="6.5" fill="#FFF7ED"/>
    <text x="284" y="571" text-anchor="middle" font-size="9" font-weight="800" fill="#EA580C">81%</text>
  </g>

  <!-- Connector dashed line from table toward diagram -->
  <path d="M 328 538 H 470 V 470" fill="none" stroke="#A5B4FC" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- ───────────────── RIGHT DIAGRAM ───────────────── -->

  <!-- Signal source icons -->
  <g transform="translate(560,52)" font-family="'Arial',sans-serif">
    <rect x="0" y="0" width="46" height="46" rx="13" fill="white" stroke="#E0E7FF" stroke-width="1.5" filter="url(#smallShadow)"/>
    <text x="23" y="30" text-anchor="middle" font-size="20">💬</text>
    <rect x="62" y="0" width="46" height="46" rx="13" fill="white" stroke="#E0E7FF" stroke-width="1.5" filter="url(#smallShadow)"/>
    <text x="85" y="30" text-anchor="middle" font-size="20">📊</text>
    <rect x="124" y="0" width="46" height="46" rx="13" fill="white" stroke="#E0E7FF" stroke-width="1.5" filter="url(#smallShadow)"/>
    <text x="147" y="30" text-anchor="middle" font-size="20">📋</text>
    <rect x="186" y="0" width="46" height="46" rx="13" fill="white" stroke="#E0E7FF" stroke-width="1.5" filter="url(#smallShadow)"/>
    <text x="209" y="30" text-anchor="middle" font-size="20">🎫</text>
    <text x="116" y="74" text-anchor="middle" font-size="11" fill="#6366F1" font-weight="700" letter-spacing="1.5">RAW SIGNAL SOURCES</text>
  </g>

  <!-- Connector from sources to pipeline -->
  <line x1="676" y1="138" x2="676" y2="160" stroke="#C7D2FE" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Pipeline cards -->
  <g font-family="'Arial',sans-serif">

    <!-- 1 -->
    <rect x="560" y="160" width="320" height="64" rx="14" fill="white" stroke="#E0E7FF" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect x="578" y="178" width="28" height="28" rx="9" fill="url(#cardA)"/>
    <text x="592" y="197" text-anchor="middle" font-size="14">📥</text>
    <text x="618" y="190" font-size="13" font-weight="800" fill="#1E1B4B">SIGNAL INGESTION</text>
    <text x="618" y="207" font-size="11" fill="#6B7280">Interviews, surveys, analytics &amp; tickets merged</text>
    <line x1="676" y1="224" x2="676" y2="238" stroke="#C7D2FE" stroke-width="1.5" stroke-dasharray="4 3"/>
    <path d="M 671 234 L 676 240 L 681 234" fill="none" stroke="#C7D2FE" stroke-width="1.5"/>

    <!-- 2 -->
    <rect x="560" y="240" width="320" height="64" rx="14" fill="white" stroke="#E0E7FF" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect x="578" y="258" width="28" height="28" rx="9" fill="url(#cardA)"/>
    <text x="592" y="277" text-anchor="middle" font-size="14">🧩</text>
    <text x="618" y="270" font-size="13" font-weight="800" fill="#1E1B4B">BEHAVIORAL CLUSTERING</text>
    <text x="618" y="287" font-size="11" fill="#6B7280">AI detects patterns across real usage, not opinions</text>
    <line x1="676" y1="304" x2="676" y2="318" stroke="#C7D2FE" stroke-width="1.5" stroke-dasharray="4 3"/>
    <path d="M 671 314 L 676 320 L 681 314" fill="none" stroke="#C7D2FE" stroke-width="1.5"/>

    <!-- 3 -->
    <rect x="560" y="320" width="320" height="64" rx="14" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect x="578" y="338" width="28" height="28" rx="9" fill="url(#titleAccent)"/>
    <text x="592" y="357" text-anchor="middle" font-size="14">🧬</text>
    <text x="618" y="350" font-size="13" font-weight="800" fill="#1E1B4B">ARCHETYPE SYNTHESIS</text>
    <text x="618" y="367" font-size="11" fill="#4F46E5">AI drafts evidence-backed behavioral profiles</text>
    <line x1="676" y1="384" x2="676" y2="398" stroke="#C7D2FE" stroke-width="1.5" stroke-dasharray="4 3"/>
    <path d="M 671 394 L 676 400 L 681 394" fill="none" stroke="#C7D2FE" stroke-width="1.5"/>

    <!-- 4 -->
    <rect x="560" y="400" width="320" height="64" rx="14" fill="white" stroke="#E0E7FF" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect x="578" y="418" width="28" height="28" rx="9" fill="url(#cardA)"/>
    <text x="592" y="437" text-anchor="middle" font-size="14">✅</text>
    <text x="618" y="430" font-size="13" font-weight="800" fill="#1E1B4B">CONFIDENCE SCORING</text>
    <text x="618" y="447" font-size="11" fill="#6B7280">Cross-validated against live product data</text>
    <line x1="676" y1="464" x2="676" y2="478" stroke="#C7D2FE" stroke-width="1.5" stroke-dasharray="4 3"/>
    <path d="M 671 474 L 676 480 L 681 474" fill="none" stroke="#C7D2FE" stroke-width="1.5"/>

    <!-- 5 -->
    <rect x="560" y="480" width="320" height="64" rx="14" fill="white" stroke="#E0E7FF" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect x="578" y="498" width="28" height="28" rx="9" fill="url(#cardA)"/>
    <text x="592" y="517" text-anchor="middle" font-size="14">🔁</text>
    <text x="618" y="510" font-size="13" font-weight="800" fill="#1E1B4B">LIVE PERSONA OUTPUT</text>
    <text x="618" y="527" font-size="11" fill="#6B7280">Auto-refreshing profile — never a static doc again</text>
  </g>

  <!-- Side panel: Traditional vs AI -->
  <g transform="translate(908,160)" font-family="'Arial',sans-serif">
    <rect x="0" y="0" width="244" height="172" rx="16" fill="white" stroke="#E0E7FF" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect x="20" y="20" width="26" height="26" rx="8" fill="#EEF2FF"/>
    <text x="33" y="38" text-anchor="middle" font-size="13">⚖️</text>
    <text x="56" y="38" font-size="13" font-weight="800" fill="#1E1B4B">TRADITIONAL VS AI</text>

    <circle cx="30" cy="68" r="3" fill="#A1A1AA"/>
    <text x="42" y="72" font-size="11" fill="#52525B">Static doc <tspan fill="#A1A1AA">→</tspan> <tspan fill="#1E1B4B" font-weight="700">Living profile</tspan></text>

    <circle cx="30" cy="92" r="3" fill="#A1A1AA"/>
    <text x="42" y="96" font-size="11" fill="#52525B">Assumptions <tspan fill="#A1A1AA">→</tspan> <tspan fill="#1E1B4B" font-weight="700">Real signals</tspan></text>

    <circle cx="30" cy="116" r="3" fill="#A1A1AA"/>
    <text x="42" y="120" font-size="11" fill="#52525B">Annual refresh <tspan fill="#A1A1AA">→</tspan> <tspan fill="#1E1B4B" font-weight="700">Continuous</tspan></text>

    <circle cx="30" cy="140" r="3" fill="#A1A1AA"/>
    <text x="42" y="144" font-size="11" fill="#52525B">One-size-fits-all <tspan fill="#A1A1AA">→</tspan> <tspan fill="#1E1B4B" font-weight="700">Cluster-specific</tspan></text>
  </g>

  <!-- Connector between panels -->
  <line x1="1030" y1="332" x2="1030" y2="350" stroke="#C7D2FE" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Side panel: What changed -->
  <g transform="translate(908,352)" font-family="'Arial',sans-serif">
    <rect x="0" y="0" width="244" height="192" rx="16" fill="#1E1B4B" filter="url(#cardShadow)"/>
    <rect x="20" y="20" width="26" height="26" rx="8" fill="rgba(255,255,255,0.12)"/>
    <text x="33" y="38" text-anchor="middle" font-size="13">✨</text>
    <text x="56" y="38" font-size="13" font-weight="800" fill="white">WHAT CHANGED</text>

    <circle cx="30" cy="68" r="3" fill="#A78BFA"/>
    <text x="42" y="72" font-size="11" fill="#E0E7FF">Decisions backed by evidence</text>

    <circle cx="30" cy="94" r="3" fill="#A78BFA"/>
    <text x="42" y="98" font-size="11" fill="#E0E7FF">Faster cross-team alignment</text>

    <circle cx="30" cy="120" r="3" fill="#A78BFA"/>
    <text x="42" y="124" font-size="11" fill="#E0E7FF">Personas teams actually open</text>

    <circle cx="30" cy="146" r="3" fill="#A78BFA"/>
    <text x="42" y="150" font-size="11" fill="#E0E7FF">Hidden user segments surfaced</text>

    <rect x="20" y="164" width="204" height="1" fill="rgba(255,255,255,0.12)"/>
    <text x="20" y="184" font-size="10" fill="#A5B4FC" font-style="italic">"The persona finally felt like a person."</text>
  </g>

  <!-- Byline -->
  <text x="1152" y="612" text-anchor="end" font-size="13" font-weight="700" fill="#6366F1" font-family="'Arial',sans-serif" opacity="0.75" letter-spacing="0.5">By Kartik Bhalerao</text>
</svg>
