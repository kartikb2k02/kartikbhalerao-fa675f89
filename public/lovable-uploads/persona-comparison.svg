<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FAF9FF"/>
      <stop offset="100%" style="stop-color:#F4F3FC"/>
    </linearGradient>
    <linearGradient id="aiAvatar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C3AED"/>
      <stop offset="100%" style="stop-color:#4F46E5"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#EEF2FF"/>
      <stop offset="100%" style="stop-color:#F5F3FF"/>
    </linearGradient>
    <radialGradient id="aiGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#A78BFA;stop-opacity:0.22"/>
      <stop offset="100%" style="stop-color:#A78BFA;stop-opacity:0"/>
    </radialGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="rgba(79,70,229,0.10)"/>
    </filter>
    <filter id="cardShadowAI" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="26" flood-color="rgba(124,58,237,0.22)"/>
    </filter>
    <filter id="badgeShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="rgba(79,70,229,0.18)"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bgGrad)"/>
  <circle cx="60" cy="60" r="140" fill="#A5B4FC" opacity="0.06"/>
  <circle cx="1150" cy="760" r="160" fill="#C4B5FD" opacity="0.07"/>

  <!-- ── Title ── -->
  <text x="600" y="76" text-anchor="middle" font-size="38" font-weight="900" fill="#1E1B4B" font-family="'Arial Black',sans-serif">Traditional Persona vs. AI-Generated Persona</text>
  <text x="600" y="110" text-anchor="middle" font-size="18" fill="#6B7280" font-family="'Arial',sans-serif">Same question — "who is our user?" — built two completely different ways.</text>

  <!-- Glow behind AI card -->
  <ellipse cx="870" cy="410" rx="320" ry="290" fill="url(#aiGlow)"/>

  <!-- ════════ LEFT CARD — Traditional Persona ════════ -->
  <g transform="translate(80,170)" font-family="'Arial',sans-serif">
    <rect x="0" y="0" width="500" height="480" rx="22" fill="#ffffff" stroke="#ECECF4" stroke-width="1.5" filter="url(#cardShadow)"/>

    <!-- Header -->
    <circle cx="70" cy="70" r="32" fill="#9CA3AF"/>
    <circle cx="70" cy="61" r="12" fill="white" opacity="0.9"/>
    <path d="M 49 90 Q 70 70 91 90 L 91 96 Q 70 86 49 96 Z" fill="white" opacity="0.9"/>
    <text x="120" y="64" font-size="22" font-weight="800" fill="#3F3F46">Traditional Persona</text>
    <text x="120" y="87" font-size="14" fill="#9CA3AF">Built from assumptions</text>
    <line x1="40" y1="120" x2="460" y2="120" stroke="#F1F1F6" stroke-width="1.5"/>

    <!-- Row 1 -->
    <rect x="40" y="150" width="44" height="44" rx="13" fill="#F4F4F6" stroke="#E5E7EB" stroke-width="1.4"/>
    <text x="62" y="178" text-anchor="middle" font-size="19">👤</text>
    <text x="102" y="170" font-size="16" font-weight="800" fill="#3F3F46">Sneha, 31 — Product Marketer</text>
    <text x="102" y="190" font-size="12.5" fill="#9CA3AF">Demographic label, not a behavior</text>
    <line x1="40" y1="220" x2="460" y2="220" stroke="#F1F1F6" stroke-width="1.5" stroke-dasharray="5 4"/>

    <!-- Row 2 -->
    <rect x="40" y="235" width="44" height="44" rx="13" fill="#F4F4F6" stroke="#E5E7EB" stroke-width="1.4"/>
    <text x="62" y="263" text-anchor="middle" font-size="19">📱</text>
    <text x="102" y="255" font-size="16" font-weight="800" fill="#3F3F46">Uses Fintech Apps Regularly</text>
    <text x="102" y="275" font-size="12.5" fill="#9CA3AF">No insight into why, or what frustrates her</text>
    <line x1="40" y1="305" x2="460" y2="305" stroke="#F1F1F6" stroke-width="1.5" stroke-dasharray="5 4"/>

    <!-- Row 3 -->
    <rect x="40" y="320" width="44" height="44" rx="13" fill="#F4F4F6" stroke="#E5E7EB" stroke-width="1.4"/>
    <text x="62" y="348" text-anchor="middle" font-size="19">🎯</text>
    <text x="102" y="340" font-size="16" font-weight="800" fill="#3F3F46">Goal: Simplicity</text>
    <text x="102" y="360" font-size="12.5" fill="#9CA3AF">Pain: Busy schedule — that's the whole profile</text>

    <!-- Tag -->
    <rect x="40" y="404" width="420" height="48" rx="12" fill="#F4F4F6"/>
    <circle cx="68" cy="428" r="11" fill="none" stroke="#9CA3AF" stroke-width="1.6"/>
    <path d="M 62 428 a 6 6 0 0 1 12 0" fill="none" stroke="#9CA3AF" stroke-width="1.4"/>
    <text x="92" y="433" font-size="14.5" font-weight="700" fill="#6B7280">Low confidence</text>
  </g>

  <!-- ════════ VS badge ════════ -->
  <circle cx="600" cy="410" r="38" fill="white" stroke="#DDD6FE" stroke-width="2" filter="url(#badgeShadow)"/>
  <text x="600" y="418" text-anchor="middle" font-size="18" font-weight="900" fill="#4F46E5" font-family="'Arial Black',sans-serif">VS.</text>
  <line x1="600" y1="172" x2="600" y2="364" stroke="#DDD6FE" stroke-width="1.5" stroke-dasharray="3 5"/>
  <line x1="600" y1="456" x2="600" y2="648" stroke="#DDD6FE" stroke-width="1.5" stroke-dasharray="3 5"/>

  <!-- ════════ RIGHT CARD — AI-Generated Persona ════════ -->
  <g transform="translate(620,170)" font-family="'Arial',sans-serif">
    <rect x="0" y="0" width="500" height="480" rx="22" fill="#ffffff" stroke="#DDD6FE" stroke-width="2" filter="url(#cardShadowAI)"/>
    <rect x="0" y="0" width="500" height="6" rx="3" fill="url(#aiAvatar)"/>

    <!-- Badge -->
    <rect x="392" y="24" width="84" height="26" rx="13" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1"/>
    <text x="434" y="41" text-anchor="middle" font-size="10.5" font-weight="800" fill="#4F46E5" letter-spacing="0.6">✨ AI</text>

    <!-- Header -->
    <circle cx="70" cy="70" r="32" fill="url(#aiAvatar)"/>
    <circle cx="70" cy="61" r="12" fill="white" opacity="0.95"/>
    <path d="M 49 90 Q 70 70 91 90 L 91 96 Q 70 86 49 96 Z" fill="white" opacity="0.95"/>
    <text x="120" y="64" font-size="22" font-weight="800" fill="#1E1B4B">AI-Generated Persona</text>
    <text x="120" y="87" font-size="14" fill="#7C3AED" font-weight="600">Built from real behavior</text>
    <line x1="40" y1="120" x2="460" y2="120" stroke="#EDE9FE" stroke-width="1.5"/>

    <!-- Row 1 -->
    <rect x="40" y="150" width="44" height="44" rx="13" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.4"/>
    <text x="62" y="178" text-anchor="middle" font-size="19">🧭</text>
    <text x="102" y="170" font-size="15" font-weight="800" fill="#1E1B4B">"The Validation-Seeking Explorer"</text>
    <text x="102" y="190" font-size="12.5" fill="#7C7C9C">A named archetype — not just an age and job title</text>
    <line x1="40" y1="220" x2="460" y2="220" stroke="#EDE9FE" stroke-width="1.5" stroke-dasharray="5 4"/>

    <!-- Row 2 -->
    <rect x="40" y="235" width="44" height="44" rx="13" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.4"/>
    <text x="62" y="263" text-anchor="middle" font-size="19">⚡</text>
    <text x="102" y="255" font-size="16" font-weight="800" fill="#1E1B4B">Abandons Within 2–3 Minutes</text>
    <text x="102" y="275" font-size="12.5" fill="#7C7C9C">Quits onboarding fast if value isn't obvious</text>
    <line x1="40" y1="305" x2="460" y2="305" stroke="#EDE9FE" stroke-width="1.5" stroke-dasharray="5 4"/>

    <!-- Row 3 -->
    <rect x="40" y="320" width="44" height="44" rx="13" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.4"/>
    <text x="62" y="348" text-anchor="middle" font-size="19">🤝</text>
    <text x="102" y="340" font-size="16" font-weight="800" fill="#1E1B4B">Needs Reassurance to Trust AI</text>
    <text x="102" y="360" font-size="12.5" fill="#7C7C9C">Compares alternatives; wary when AI feels "too smart"</text>

    <!-- Tag -->
    <rect x="40" y="404" width="420" height="48" rx="12" fill="url(#aiAvatar)"/>
    <circle cx="68" cy="428" r="11" fill="none" stroke="white" stroke-width="1.8"/>
    <path d="M 63 428 l 4 4 l 7 -8" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="92" y="433" font-size="14.5" font-weight="700" fill="white">High confidence</text>
  </g>

  <!-- ════════ Bottom callout bar ════════ -->
  <g font-family="'Arial',sans-serif">
    <rect x="80" y="672" width="1040" height="108" rx="20" fill="url(#barGrad)" stroke="#E0E7FF" stroke-width="1.5"/>

    <circle cx="160" cy="726" r="34" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.5"/>
    <text x="160" y="736" text-anchor="middle" font-size="24">🧠</text>

    <text x="216" y="717" font-size="22" font-weight="900" fill="#1E1B4B">Same question. </text>
    <text x="216" y="747" font-size="22" font-weight="900" fill="#4F46E5">Completely different answers.</text>
    <rect x="216" y="754" width="318" height="4" rx="2" fill="#A78BFA" opacity="0.55"/>

    <line x1="700" y1="696" x2="700" y2="756" stroke="#DDD6FE" stroke-width="1.5"/>

    <text x="730" y="718" font-size="15" fill="#52525B">One is a guess that ages.</text>
    <text x="730" y="742" font-size="15" font-weight="800" fill="#1E1B4B">The other learns as your users do.</text>
  </g>

  <!-- Byline -->
  <text x="1152" y="796" text-anchor="end" font-size="13" font-weight="700" fill="#6366F1" font-family="'Arial',sans-serif" opacity="0.7" letter-spacing="0.5">By Kartik Bhalerao</text>
</svg>
