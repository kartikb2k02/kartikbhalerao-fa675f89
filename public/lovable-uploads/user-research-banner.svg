<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F0FDF9"/>
      <stop offset="50%" style="stop-color:#ECFDF5"/>
      <stop offset="100%" style="stop-color:#F0FDFA"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#059669"/>
      <stop offset="100%" style="stop-color:#0D9488"/>
    </linearGradient>
    <linearGradient id="cardGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <linearGradient id="cardTeal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#14B8A6"/>
      <stop offset="100%" style="stop-color:#0D9488"/>
    </linearGradient>
    <linearGradient id="cardCoral" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F97316"/>
      <stop offset="100%" style="stop-color:#EA580C"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="rgba(5,150,105,0.15)"/>
    </filter>
    <filter id="shadowCard">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="rgba(0,0,0,0.08)"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle background shapes -->
  <circle cx="1100" cy="100" r="200" fill="#10B981" opacity="0.05"/>
  <circle cx="80"   cy="500" r="150" fill="#14B8A6" opacity="0.06"/>
  <circle cx="600"  cy="700" r="250" fill="#059669" opacity="0.04"/>

  <!-- Dot pattern top-right -->
  <g opacity="0.2">
    <circle cx="980" cy="40"  r="3" fill="#10B981"/>
    <circle cx="1010" cy="40" r="3" fill="#10B981"/>
    <circle cx="1040" cy="40" r="3" fill="#10B981"/>
    <circle cx="1070" cy="40" r="3" fill="#10B981"/>
    <circle cx="1100" cy="40" r="3" fill="#10B981"/>
    <circle cx="980" cy="70"  r="3" fill="#14B8A6"/>
    <circle cx="1010" cy="70" r="3" fill="#14B8A6"/>
    <circle cx="1040" cy="70" r="3" fill="#14B8A6"/>
    <circle cx="1070" cy="70" r="3" fill="#14B8A6"/>
    <circle cx="1100" cy="70" r="3" fill="#14B8A6"/>
    <circle cx="980" cy="100" r="3" fill="#0D9488"/>
    <circle cx="1010" cy="100" r="3" fill="#0D9488"/>
    <circle cx="1040" cy="100" r="3" fill="#0D9488"/>
  </g>

  <!-- ── LEFT SIDE ── -->

  <!-- Eyebrow -->
  <rect x="48" y="60" width="152" height="26" rx="13" fill="#10B981" opacity="0.12" stroke="#10B981" stroke-width="0.8"/>
  <text x="124" y="77" text-anchor="middle" font-size="10.5" fill="#059669" font-family="'Arial',sans-serif" font-weight="700" letter-spacing="1.2">USER RESEARCH</text>

  <!-- Title -->
  <text x="48" y="158" font-size="60" font-weight="900" fill="url(#titleGrad)" font-family="'Arial Black',sans-serif">User Research</text>
  <text x="48" y="224" font-size="60" font-weight="900" fill="#1A1A2E" font-family="'Arial Black',sans-serif">That Actually</text>
  <text x="48" y="290" font-size="60" font-weight="900" fill="#1A1A2E" font-family="'Arial Black',sans-serif">Matters</text>

  <!-- Underline accent -->
  <rect x="48" y="300" width="320" height="5" rx="3" fill="#10B981" opacity="0.3"/>

  <!-- Subtitle -->
  <text x="48" y="334" font-size="16" fill="#6B7280" font-family="'Arial',sans-serif">Moving beyond vanity metrics to insights</text>
  <text x="48" y="354" font-size="16" fill="#6B7280" font-family="'Arial',sans-serif">that actually drive product decisions.</text>

  <!-- Quote block -->
  <rect x="48" y="378" width="430" height="76" rx="14" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.5"/>
  <text x="66" y="400" font-size="28" fill="#10B981" font-family="Georgia,serif" opacity="0.7">"</text>
  <text x="84" y="404" font-size="13" fill="#374151" font-family="'Arial',sans-serif" font-style="italic">Talk to your users before you build,</text>
  <text x="84" y="420" font-size="13" fill="#374151" font-family="'Arial',sans-serif" font-style="italic">while you build, and after you build.</text>
  <text x="84" y="440" font-size="11" fill="#9CA3AF" font-family="'Arial',sans-serif">— Every great PM, ever</text>

  <!-- Chips -->
  <g transform="translate(48,472)">
    <rect x="0"   y="0" width="132" height="26" rx="13" fill="#10B981" opacity="0.12" stroke="#10B981" stroke-width="0.8"/>
    <text x="66"  y="17" text-anchor="middle" font-size="11" fill="#059669" font-family="'Arial',sans-serif" font-weight="600">🎙 Interviews</text>
    <rect x="142" y="0" width="104" height="26" rx="13" fill="#14B8A6" opacity="0.12" stroke="#14B8A6" stroke-width="0.8"/>
    <text x="194" y="17" text-anchor="middle" font-size="11" fill="#0D9488" font-family="'Arial',sans-serif" font-weight="600">📋 Surveys</text>
    <rect x="256" y="0" width="130" height="26" rx="13" fill="#F97316" opacity="0.12" stroke="#F97316" stroke-width="0.8"/>
    <text x="321" y="17" text-anchor="middle" font-size="11" fill="#EA580C" font-family="'Arial',sans-serif" font-weight="600">🖥 Usability Tests</text>
  </g>

  <!-- ── RIGHT: Visual cards ── -->

  <!-- Big user avatar card -->
  <rect x="538" y="48" width="620" height="534" rx="28" fill="white" filter="url(#shadow)"/>

  <!-- Header strip -->
  <rect x="538" y="48" width="620" height="52" rx="28 28 0 0" fill="#059669"/>
  <text x="848" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="white" font-family="'Arial',sans-serif" letter-spacing="1">RESEARCH INSIGHTS BOARD</text>

  <!-- Method cards row 1 -->
  <!-- Card A -->
  <rect x="562" y="122" width="176" height="148" rx="16" fill="url(#cardGreen)" filter="url(#shadowCard)"/>
  <text x="650" y="158" text-anchor="middle" font-size="36">🎙</text>
  <text x="650" y="190" text-anchor="middle" font-size="14" font-weight="900" fill="white" font-family="'Arial Black',sans-serif">INTERVIEWS</text>
  <text x="650" y="210" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.85)" font-family="'Arial',sans-serif">1:1 deep dives</text>
  <text x="650" y="226" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.85)" font-family="'Arial',sans-serif">for real stories</text>
  <rect x="620" y="244" width="60" height="16" rx="8" fill="rgba(255,255,255,0.2)"/>
  <text x="650" y="256" text-anchor="middle" font-size="9" fill="white" font-family="'Arial',sans-serif">20+ users</text>

  <!-- Card B -->
  <rect x="754" y="122" width="176" height="148" rx="16" fill="url(#cardTeal)" filter="url(#shadowCard)"/>
  <text x="842" y="158" text-anchor="middle" font-size="36">📋</text>
  <text x="842" y="190" text-anchor="middle" font-size="14" font-weight="900" fill="white" font-family="'Arial Black',sans-serif">SURVEYS</text>
  <text x="842" y="210" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.85)" font-family="'Arial',sans-serif">Quantify pain</text>
  <text x="842" y="226" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.85)" font-family="'Arial',sans-serif">at scale</text>
  <rect x="812" y="244" width="60" height="16" rx="8" fill="rgba(255,255,255,0.2)"/>
  <text x="842" y="256" text-anchor="middle" font-size="9" fill="white" font-family="'Arial',sans-serif">100+ responses</text>

  <!-- Card C -->
  <rect x="946" y="122" width="176" height="148" rx="16" fill="url(#cardCoral)" filter="url(#shadowCard)"/>
  <text x="1034" y="158" text-anchor="middle" font-size="36">🖥</text>
  <text x="1034" y="190" text-anchor="middle" font-size="13" font-weight="900" fill="white" font-family="'Arial Black',sans-serif">USABILITY</text>
  <text x="1034" y="208" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.85)" font-family="'Arial',sans-serif">Watch real users</text>
  <text x="1034" y="224" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.85)" font-family="'Arial',sans-serif">break your product</text>
  <rect x="1004" y="244" width="60" height="16" rx="8" fill="rgba(255,255,255,0.2)"/>
  <text x="1034" y="256" text-anchor="middle" font-size="9" fill="white" font-family="'Arial',sans-serif">5 testers</text>

  <!-- Divider -->
  <line x1="562" y1="292" x2="1130" y2="292" stroke="#D1FAE5" stroke-width="1.5"/>

  <!-- Insight bubbles row -->
  <text x="848" y="322" text-anchor="middle" font-size="11" fill="#6B7280" font-family="'Arial',sans-serif" font-weight="600" letter-spacing="0.8">TOP INSIGHTS FROM THE FIELD</text>

  <!-- Insight 1 -->
  <rect x="562" y="336" width="560" height="52" rx="12" fill="#F0FDF4" stroke="#A7F3D0" stroke-width="1"/>
  <circle cx="590" cy="362" r="16" fill="#10B981"/>
  <text x="590" y="367" text-anchor="middle" font-size="16" fill="white">📌</text>
  <text x="622" y="356" font-size="12" font-weight="700" fill="#065F46" font-family="'Arial',sans-serif">Users don't read — they scan.</text>
  <text x="622" y="374" font-size="11" fill="#6B7280" font-family="'Arial',sans-serif">Design for attention, not explanation.</text>

  <!-- Insight 2 -->
  <rect x="562" y="396" width="560" height="52" rx="12" fill="#F0FDFA" stroke="#99F6E4" stroke-width="1"/>
  <circle cx="590" cy="422" r="16" fill="#14B8A6"/>
  <text x="590" y="427" text-anchor="middle" font-size="16" fill="white">💬</text>
  <text x="622" y="416" font-size="12" font-weight="700" fill="#134E4A" font-family="'Arial',sans-serif">What users say ≠ what users do.</text>
  <text x="622" y="434" font-size="11" fill="#6B7280" font-family="'Arial',sans-serif">Observe behaviour, not just opinions.</text>

  <!-- Insight 3 -->
  <rect x="562" y="456" width="560" height="52" rx="12" fill="#FFF7ED" stroke="#FED7AA" stroke-width="1"/>
  <circle cx="590" cy="482" r="16" fill="#F97316"/>
  <text x="590" y="487" text-anchor="middle" font-size="16" fill="white">🎯</text>
  <text x="622" y="476" font-size="12" font-weight="700" fill="#7C2D12" font-family="'Arial',sans-serif">5 users reveal 85% of usability issues.</text>
  <text x="622" y="494" font-size="11" fill="#6B7280" font-family="'Arial',sans-serif">You don't need hundreds — you need the right ones.</text>

  <!-- Insight 4 -->
  <rect x="562" y="516" width="560" height="52" rx="12" fill="#F0FDF4" stroke="#A7F3D0" stroke-width="1"/>
  <circle cx="590" cy="542" r="16" fill="#059669"/>
  <text x="590" y="547" text-anchor="middle" font-size="16" fill="white">🔄</text>
  <text x="622" y="536" font-size="12" font-weight="700" fill="#065F46" font-family="'Arial',sans-serif">Research is not a phase — it's a habit.</text>
  <text x="622" y="554" font-size="11" fill="#6B7280" font-family="'Arial',sans-serif">Continuous discovery beats quarterly sprints.</text>

  <!-- Byline -->
  <text x="1152" y="614" text-anchor="end" font-size="13" font-weight="700" fill="#059669" font-family="'Arial',sans-serif" opacity="0.7" letter-spacing="0.5">By Kartik Bhalerao</text>
</svg>
