[build]
  command = "npm run build"
  publish = "dist"

# Redirect old numeric blog IDs to slug-based URLs (301 = permanent, preserves SEO)
[[redirects]]
  from = "/blog/1"
  to = "/blog/ai-first-product-strategy"
  status = 301

[[redirects]]
  from = "/blog/2"
  to = "/blog/moscow-prioritization-method"
  status = 301

[[redirects]]
  from = "/blog/3"
  to = "/blog/ai-copilot-decision-making"
  status = 301

[[redirects]]
  from = "/blog/4"
  to = "/blog/data-driven-decision-making-experience"
  status = 301

[[redirects]]
  from = "/blog/5"
  to = "/blog/idea-to-mvp-product-manager-journey"
  status = 301

[[redirects]]
  from = "/blog/6"
  to = "/blog/user-research-that-matters"
  status = 301

[[redirects]]
  from = "/blog/7"
  to = "/blog/scaling-product-teams-lessons"
  status = 301

[[redirects]]
  from = "/blog/8"
  to = "/blog/ai-replaced-pm-workflow-7-days"
  status = 301

# SPA fallback — must be last
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
